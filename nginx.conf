events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;
    
    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # -------------------------- 1. HTTP 80端口配置（修改：适配你的域名+强制跳转HTTPS）--------------------------
    server {
        listen       80;
        # 关键：替换为你的证书绑定域名（不能用localhost，否则SSL无效）
        server_name  zfank.site www.zfank.site;  
        root         /usr/share/nginx/html;
        index        index.html;

        # 处理单页应用路由（保留原功能）
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态资源缓存（保留原功能）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 安全头（保留原功能）
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # 新增：所有HTTP请求强制跳转到HTTPS（确保访问80端口也会自动转443）
        return 301 https://$host$request_uri; 
    }

    # -------------------------- 2. HTTPS 443端口配置（新增：适配你的DigiCert证书）--------------------------
    server {
        listen       443 ssl;  # 监听443端口并启用SSL
        # 关键：与证书绑定域名完全一致（zfank.site + www.zfank.site）
        server_name  zfank.site www.zfank.site;  

        # -------------------------- SSL核心配置（必须与你的证书文件匹配）--------------------------
        # 1. 证书文件路径：请确认这两个文件实际存放在服务器的 /ssl 目录下（若路径不同，需修改）
        ssl_certificate /ssl/cert.pem;  # 公钥文件（需包含服务器证书+DigiCert中间证书）
        ssl_certificate_key /ssl/cert.key;  # 私钥文件（RSA_2048算法，无密码）
        
        # 2. 安全协议与加密套件（适配DigiCert证书，避免兼容性问题）
        ssl_protocols TLSv1.2 TLSv1.3;  # 禁用不安全的旧协议
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;  # 优先使用服务器安全套件
        
        # 3. 性能与信任链优化（DigiCert推荐配置）
        ssl_session_cache shared:SSL:10m;  # 复用SSL会话，提升速度
        ssl_session_timeout 10m;
        ssl_trusted_certificate /ssl/cert.pem;  # 信任证书链（与公钥文件一致）
        ssl_stapling on;  # 启用OCSP stapling，加速证书验证
        ssl_stapling_verify on;
        resolver 8.8.8.8 114.114.114.114 valid=300s;  # 解析OCSP地址（国内外DNS）
        resolver_timeout 5s;

        # -------------------------- 网站业务配置（与80端口完全一致，确保功能统一）--------------------------
        root         /usr/share/nginx/html;
        index        index.html;

        # 单页应用路由处理
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 安全头（新增HSTS，强制浏览器用HTTPS）
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
